# nginx 정적 서빙 — dist/ 를 8082 로 제공. 20260908부터 데이터는 Spring REST API로 조회한다.
# React와 Spring을 같은 origin으로 배치하거나 VITE_PORTAL_API_BASE를 지정한다.
server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시 파일명 정적 자산은 장기 캐시 (재빌드 시 파일명이 바뀜)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
